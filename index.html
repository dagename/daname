<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Random Name Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#3b82f6',
            accent: '#1e40af'
          }
        }
      }
    };
  </script>
</head>
<body class="bg-gradient-to-tr from-blue-100 via-white to-blue-200 dark:from-gray-800 dark:via-gray-900 dark:to-gray-800 min-h-screen flex flex-col font-sans transition-all">

  <!-- header loaded dynamically by layouts.js -->
  <header id="header" class="w-full bg-white dark:bg-gray-900 border-b border-blue-200 dark:border-gray-700 py-4 px-6 shadow z-10"></header>

<main class="flex-1 flex items-center justify-center p-6">
  <div class="bg-white dark:bg-gray-900 rounded-3xl shadow-2xl p-8 w-full max-w-md border border-blue-200 dark:border-gray-700">
    <div class="flex justify-between items-center mb-6">
      <h2 id="title" class="text-3xl font-extrabold text-blue-700 dark:text-blue-300 text-center w-full">
        🎲 Da Random Name Generator
      </h2>
    </div>

    <!-- Buttons -->
    <div class="flex gap-2">
      <button id="generateBtn" class="flex-1 bg-primary hover:bg-accent text-white font-medium py-3 rounded-xl transition-all shadow-md">
        Generate Name
      </button>
      <button id="copyBtn" class="bg-white dark:bg-gray-800 border border-primary text-primary hover:bg-blue-100 dark:hover:bg-gray-700 font-medium px-4 py-3 rounded-xl transition-all shadow-md">
        📋
      </button>
    </div>

    <!-- Name output -->
    <div id="nameOutput" class="text-3xl font-semibold text-blue-700 dark:text-blue-300 text-center mt-8 bg-blue-50 dark:bg-gray-800 border border-blue-200 dark:border-gray-700 rounded-2xl p-6 shadow-inner">
      Click “Generate Name” to start
    </div>

    <!-- Copy tip -->
    <div id="copyTip" class="text-center text-green-600 dark:text-green-400 text-sm mt-4 hidden opacity-0 transition-opacity duration-500">
      Name copied!
    </div>
  </div>
</main>


  <!-- footer loaded dynamically by layouts.js -->
  <footer id="footer" class="w-full bg-white dark:bg-gray-900 border-t border-blue-200 dark:border-gray-700 py-6 px-4 text-center text-sm text-gray-500 dark:text-gray-400"></footer>

  <!-- shared layout loader -->
  <script src="/layouts.js"></script>
  
<script>
  const texts = {
    en: { title: "🎲 Da Random Name Generator", button: "Generate Name", placeholder: "Click 'Generate Name' to start", copied: "Name copied!" },
    zh: { title: "🎲 Da 随机姓名生成器", button: "生成姓名", placeholder: "点击“生成姓名”开始", copied: "姓名已复制！" },
    es: { title: "🎲 Da Generador de Nombres Aleatorios", button: "Generar Nombre", placeholder: "Haz clic en 'Generar Nombre' para empezar", copied: "¡Nombre copiado!" },
    fr: { title: "🎲 Da Générateur de Noms Aléatoires", button: "Générer un Nom", placeholder: "Cliquez sur 'Générer un Nom' pour commencer", copied: "Nom copié !" },
    de: { title: "🎲 Da Zufälliger Namensgenerator", button: "Namen generieren", placeholder: "Klicke auf 'Namen generieren', um zu starten", copied: "Name kopiert!" },
    ja: { title: "🎲 Da ランダム名前ジェネレーター", button: "名前を生成", placeholder: "「名前を生成」をクリックして開始", copied: "名前をコピーしました！" }
  };

  let currentLang = language || 'en';
  let t = texts[currentLang] || texts.en;

  function applyLanguage() {
    t = texts[currentLang] || texts.en;
    document.getElementById('title').textContent = t.title;
    document.getElementById('generateBtn').textContent = t.button;
    document.getElementById('nameOutput').textContent = t.placeholder;
  }

  window.addEventListener('DOMContentLoaded', () => {
    applyLanguage();
  });

  function eventLanguageChanged(lang) {
    currentLang = lang;
    applyLanguage();
  }

  // Fetch random name
  document.addEventListener('DOMContentLoaded', () => {
    const nameOutput = document.getElementById('nameOutput');
    const copyTip = document.getElementById('copyTip');

    document.getElementById('generateBtn').addEventListener('click', async () => {
      const res = await fetch(`/newname`);
      const name = await res.text();
      nameOutput.textContent = name.trim();
    });

    document.getElementById('copyBtn').addEventListener('click', async () => {
      const text = nameOutput.textContent.trim();
      if (!text || text.includes('Generate')) return;

      await navigator.clipboard.writeText(text);
      copyTip.textContent = t.copied;
      copyTip.classList.remove('hidden');
      copyTip.style.opacity = '1';
      setTimeout(() => {
        copyTip.style.opacity = '0';
        setTimeout(() => copyTip.classList.add('hidden'), 500);
      }, 2000);
    });
  });
</script>


</body>
</html>
