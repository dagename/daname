<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Random Name Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#3b82f6',
            accent: '#1e40af'
          }
        }
      }
    };
  </script>
</head>
<body class="bg-gradient-to-tr from-blue-100 via-white to-blue-200 dark:from-gray-800 dark:via-gray-900 dark:to-gray-800 min-h-screen flex flex-col font-sans transition-all">

  <!-- header loaded dynamically by layouts.js -->
  <header id="header" class="w-full bg-white dark:bg-gray-900 border-b border-blue-200 dark:border-gray-700 py-4 px-6 shadow z-10"></header>

  <main class="flex-1 flex items-center justify-center p-6">
    <div class="bg-white dark:bg-gray-900 rounded-3xl shadow-2xl p-8 w-full max-w-md border border-blue-200 dark:border-gray-700">
      <div class="flex justify-between items-center mb-6">
        <h2 id="title" class="text-3xl font-extrabold text-blue-700 dark:text-blue-300 text-center w-full">🎲 Random Name Generator</h2>
      </div>

      <button id="generateBtn" class="w-full bg-primary hover:bg-accent text-white font-medium py-3 rounded-xl transition-all shadow-md">
        Generate Name
      </button>

      <div id="nameOutput" class="text-3xl font-semibold text-blue-700 dark:text-blue-300 text-center mt-8 bg-blue-50 dark:bg-gray-800 border border-blue-200 dark:border-gray-700 rounded-2xl p-6 shadow-inner">
        Click “Generate Name” to start
      </div>
    </div>
  </main>

  <!-- footer loaded dynamically by layouts.js -->
  <footer id="footer" class="w-full bg-white dark:bg-gray-900 border-t border-blue-200 dark:border-gray-700 py-6 px-4 text-center text-sm text-gray-500 dark:text-gray-400"></footer>

  <!-- shared layout loader -->
  <script src="/layouts.js"></script>

<script>
  // Language texts (page-level only)
  const texts = {
    en: { title: "🎲 Da Random Name Generator", button: "Generate Name", placeholder: "Click 'Generate Name' to start" },
    zh: { title: "🎲 Da 随机姓名生成器", button: "生成姓名", placeholder: "点击“生成姓名”开始" },
    es: { title: "🎲 Da Generador de Nombres Aleatorios", button: "Generar Nombre", placeholder: "Haz clic en 'Generar Nombre' para empezar" },
    fr: { title: "🎲 Da Générateur de Noms Aléatoires", button: "Générer un Nom", placeholder: "Cliquez sur 'Générer un Nom' pour commencer" },
    de: { title: "🎲 Da Zufälliger Namensgenerator", button: "Namen generieren", placeholder: "Klicke auf 'Namen generieren', um zu starten" },
    ja: { title: "🎲 Da ランダム名前ジェネレーター", button: "名前を生成", placeholder: "「名前を生成」をクリックして開始" }
  };

  let currentLang = language || 'en';
  let t = texts[currentLang] || texts.en;

  function applyLanguage() {
    t = texts[currentLang] || texts.en;
    document.getElementById('title').textContent = t.title;
    document.getElementById('generateBtn').textContent = t.button;
    document.getElementById('nameOutput').textContent = t.placeholder;
  }

  window.addEventListener('DOMContentLoaded', () => {
    applyLanguage();
  });

  // React to global language change event (from header)
  function eventLanguageChanged(lang) {
    currentLang = lang;
    applyLanguage();
  }

  // Fetch random name
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('generateBtn').addEventListener('click', async () => {
      const res = await fetch(`/newname`);
      const name = await res.text();
      document.getElementById('nameOutput').textContent = name.trim();
    });
  });
</script>

</body>
</html>
